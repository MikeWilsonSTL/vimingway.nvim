name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Vale package
        run: cd vale && zip -r ../Vimingway.zip Vimingway
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Vimingway.zip --title "$GITHUB_REF_NAME" --generate-notes
