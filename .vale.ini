StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = write-good, proselint, Voices

# Same pattern as the Voices package's own section. With plain [*.md], Vale
# uses only that section and drops the styles below.
[*.{md,mdx,txt}]
BasedOnStyles = Vale, write-good, proselint, Voices, Vimingway

# Flags every "is" and "was"; noisy on the demo text
write-good.E-Prime = NO
